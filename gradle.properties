group = com.github.sinlordep.mcpcompanion
version = 0.3.0

pluginRepositoryUrl = https://github.com/SinLordEp/mcp-companion

# Heap for the Gradle daemon and the Kotlin compile daemon. Gradle's default (512 MB) is not enough to compile this
# plugin against the IntelliJ Platform: compileKotlin failed with "OutOfMemoryError: GC overhead limit exceeded".
# No heap dump on OutOfMemoryError (Gradle's default adds one, a file of several hundred MB in the project directory).
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=1g

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
