# Toolsets (see CompanionToolset): toolset.<toolset id>.name is the short name and toolset.<toolset id>.description
# the one-line summary, both shown on our settings page. The Exposed Tools page shows toolset.title with the short name.
toolset.title=MCP Companion：{0}
toolset.status.name=状态
toolset.status.description=插件版本、IDE 构建号、项目和各工具组的状态。
toolset.find_usages.name=查找用法
toolset.find_usages.description=查找符号的全部引用，可限定范围、按读写过滤，支持分页。
toolset.find_implementations.name=查找实现
toolset.find_implementations.description=查找实现、子类和重写方法，或反向查找父类型和父方法。
toolset.type_hierarchy.name=类型层级
toolset.type_hierarchy.description=类的父类型和子类型，可限制深度和数量。
toolset.safe_delete.name=安全删除
toolset.safe_delete.description=没有引用时才删除声明；先预览。
toolset.move.name=移动类
toolset.move.description=把类移动到另一个包或源码根目录，并更新全部引用；先预览。
toolset.change_signature.name=修改签名
toolset.change_signature.description=修改方法的参数、返回类型或可见性，并更新全部调用；先预览。
toolset.pull_up.name=上移成员
toolset.pull_up.description=把字段和方法移到父类或接口，先报告冲突；先预览。
toolset.run.name=运行控制
toolset.run.description=启动运行配置或直接运行代码，停止、重启，读取输出和测试结果，热替换。
toolset.modules.name=模块
toolset.modules.description=模块及其内容根目录和文件夹、带作用域的依赖图、循环依赖。
toolset.sync.name=构建同步
toolset.sync.description=构建文件改动后重新导入 Gradle 和 Maven 项目，并报告结果。
toolset.diagnostics.name=诊断
toolset.diagnostics.description=不构建即可列出模块、目录或文件中的错误和警告。
toolset.build.name=模块构建
toolset.build.description=只构建一个模块及其依赖，并报告带位置的错误。
toolset.quick_fix.name=快速修复
toolset.quick_fix.description=文件中问题的 IDE 快速修复；应用其中一个，作为可撤销的命令。
toolset.file_structure.name=文件结构
toolset.file_structure.description=按结构视图列出文件的大纲：类、成员及其行号，无需读取整个文件。
toolset.local_history.name=本地历史
toolset.local_history.description=IDE 本地历史的标签和差异；把文件恢复到某个标签或时间点，可撤销。
toolset.vcs_history.name=VCS 历史
toolset.vcs_history.description=通过 IDE 的 VCS 集成查看项目文件的提交历史、逐行追溯和差异。
toolset.structural_search.name=结构化搜索
toolset.structural_search.description=用搜索模板和变量约束按语法结构查找代码；只读。

